# 发布到 npmjs。
#
# 当前处于「首次发布（bootstrap）」模式：npm 不允许用 OIDC 完成包的第一次发布，
# 所以这一步用一次性 NPM_TOKEN，并把 npm 账号身份打印出来便于排错。
#
# 首次发布成功后：
#   1. 去 npmjs.com 包页面 → Settings → Trusted Publisher，登记本仓库与工作流名；
#   2. 删除仓库里的 NPM_TOKEN secret；
#   3. 把本文件改回 OIDC 版（恢复 id-token: write，去掉 publish 的 env）。
#
# 触发方式：
#   1. 手动：在 Actions 页点 “Run workflow”（请选 main 分支，不要选旧 tag）；
#   2. 打 tag：推送 v* 形式的 tag（例如 v1.0.1）。
name: Publish to npm

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  # 注意：bootstrap 阶段特意不给 id-token: write。
  # 该权限会让 npm 检测到 ACTIONS_ID_TOKEN_REQUEST_URL 而改走 OIDC 交换，
  # 但包尚未在 npm 登记 Trusted Publisher，交换必然失败。
  # 首次发布成功、登记完 Trusted Publisher 后，再把它加回来。

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          registry-url: 'https://registry.npmjs.org/'

      # tag 触发时，tag 名（去 v 前缀）必须等于 package.json 版本；
      # workflow_dispatch 手动触发时 GITHUB_REF_NAME 是分支名，此时无 tag 可比，跳过校验。
      - name: Check tag matches package version
        run: |
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            TAG_VERSION="${GITHUB_REF_NAME#v}"
            if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
              echo "tag $GITHUB_REF_NAME 与 package.json 版本 $PKG_VERSION 不一致" >&2
              exit 1
            fi
            echo "tag $GITHUB_REF_NAME 与版本 $PKG_VERSION 一致"
          else
            echo "手动触发（$GITHUB_EVENT_NAME），跳过 tag 校验，按 package.json 版本 $PKG_VERSION 发布"
          fi

      # 排错用：把身份与目标打出来。只打印账号名与 token 长度，绝不打印 token 内容。
      - name: Diagnose publish identity
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          echo "registry       : $(npm config get registry)"
          echo "package name   : $(node -p "require('./package.json').name")"
          if [ -n "$NODE_AUTH_TOKEN" ]; then
            echo "NODE_AUTH_TOKEN: 已注入（长度 ${#NODE_AUTH_TOKEN}）"
          else
            echo "NODE_AUTH_TOKEN: 未注入 —— 仓库缺少 NPM_TOKEN secret，或名字拼写不符"
          fi
          echo "--- npm whoami（token 属于哪个 npm 账号）"
          npm whoami || echo "whoami 失败 —— token 无效、已过期，或类型不被接受"

      # npm pack --dry-run：把将要上传的文件清单打出来，确认产物里没有漏掉的资源。
      - name: Inspect package contents
        run: npm pack --dry-run

      - name: Publish
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}